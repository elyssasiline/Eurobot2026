[common]
platform        = teensy
board           = teensy41
framework       = arduino
monitor_speed   = 115200
upload_protocol = teensy-cli
upload_port     = /dev/ttyACM0
monitor_port    = /dev/ttyACM0

; =============================================================================
;  ENV PRINCIPAL — micro-ROS (pour le match)
; =============================================================================
[env:teensy_ir]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
monitor_speed   = ${common.monitor_speed}
upload_protocol = ${common.upload_protocol}

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

board_microros_transport = serial
board_microros_distro    = humble

build_flags =
    -I include
    -Wno-unused-result

; =============================================================================
;  ENV DIAGNOSTIC — sans micro-ROS (calibration capteurs IR)
; =============================================================================
[env:ir_diag]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
monitor_speed   = ${common.monitor_speed}
upload_protocol = ${common.upload_protocol}

lib_deps =

build_src_filter = -<*> +<../test/ir_diag.cpp>

build_flags =
    -I include
    -D DIAG_MODE

; =============================================================================
;  ENV PINCE — séquence pince autonome (sans micro-ROS)
; =============================================================================
[env:pince]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
monitor_speed   = ${common.monitor_speed}
upload_protocol = ${common.upload_protocol}

lib_deps =
    https://github.com/pololu/tic-arduino
    https://github.com/PaulStoffregen/Servo

build_src_filter = -<*> +<../test/pince.cpp>

build_flags =
    -I include