; =============================================================================
;  PlatformIO — Robot Mecanum Eurobot 2025
;  Teensy 4.1 + 2x VNH5019 + micro-ROS
;
;  Deux environnements :
;    pio run -e teensy41   → firmware micro-ROS (flasher pour le match)
;    pio run -e diag       → mode diagnostic série (calibration moteurs)
;
;  Flash :
;    pio run -e diag -t upload      → mode calibration
;    pio run -e teensy41 -t upload  → mode match
; =============================================================================

[common]
platform = teensy
board    = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli
upload_port     = /dev/ttyACM1
monitor_port    = /dev/ttyACM1

; Bibliothèques partagées entre les deux envs
lib_deps_common =
    ; (ajouter ici les libs capteurs si nécessaire, ex: HC-SR04)

; =============================================================================
;  ENV PRINCIPAL — micro-ROS (pour le match)
; =============================================================================
[env:teensy41]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed    = ${common.monitor_speed}
upload_protocol  = ${common.upload_protocol}

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    ${common.lib_deps_common}

board_microros_transport = serial
board_microros_distro    = humble

; Sources : tout src/ + lib/ — exclut test/
build_src_filter = +<*> -<../test/>

build_flags =
    -I include
    -Wno-unused-result

; =============================================================================
;  ENV DIAGNOSTIC — sans micro-ROS (calibration moteurs)
; =============================================================================
[env:diag]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed   = ${common.monitor_speed}
upload_protocol = ${common.upload_protocol}

lib_deps =
    ${common.lib_deps_common}

; Sources : uniquement diagnostic.cpp + lib/ (pas de src/ micro-ROS)
build_src_filter = -<*> +<../test/diagnostic.cpp>

build_flags =
    -I include
    -D DIAG_MODE

; Pas de dépendance micro-ROS → compilation rapide