services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile.raspberry
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    image: robot-ros2:humble-rpi
    container_name: robot_ros2_dev
    hostname: robot-ros2
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    
    volumes:
      # Workspace ROS2
      - /home/elyssa/robot_ws:/workspace
      
      # Accès aux devices
      - /dev:/dev
      - /sys:/sys
      - /run/udev:/run/udev:ro
      
      # Display X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      
      # Cache ROS2
      - ros2-cache:/home/rosuser/.cache
      
      # Bibliothèques Python de l'hôte (READ-ONLY)
      - /usr/lib/python3/dist-packages:/usr/lib/python3/dist-packages:ro
      
      # Bibliothèques système ARM64
      - /usr/lib/aarch64-linux-gnu:/host/usr/lib/aarch64-linux-gnu:ro
      - /lib/aarch64-linux-gnu:/host/lib/aarch64-linux-gnu:ro
      
    environment:
      # Display
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      
      # ROS2
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      - PYTHONUNBUFFERED=1
      
      # Chemins des bibliothèques
      - LD_LIBRARY_PATH=/host/usr/lib/aarch64-linux-gnu:/host/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH}
      - PYTHONPATH=/usr/lib/python3/dist-packages:${PYTHONPATH}
      
    devices:
      # Devices vidéo (v4l2)
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
      - /dev/video6:/dev/video6
      - /dev/video7:/dev/video7
      
      # Devices média
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
      - /dev/media2:/dev/media2
      - /dev/media3:/dev/media3
      
      # GPIO et devices Raspberry Pi
      - /dev/gpiomem:/dev/gpiomem
      - /dev/vchiq:/dev/vchiq
      - /dev/dri:/dev/dri
      
    command: /bin/bash

volumes:
  ros2-cache: