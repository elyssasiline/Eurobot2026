services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile.raspberry
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    image: robot-ros2:humble-rpi-libcamera
    container_name: robot_ros2_dev
    hostname: robot-ros2
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    
    volumes:
      # Workspace ROS2
      - /home/elyssa/robot_ws:/workspace
      
      # Accès aux devices
      - /dev:/dev
      - /sys:/sys
      - /run/udev:/run/udev:ro
      
      # Display X11 (optionnel)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      
      # Cache ROS2
      - ros2-cache:/home/rosuser/.cache
      
    environment:
      # Display
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      
      # ROS2
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      - PYTHONUNBUFFERED=1
      
      # Libcamera
      - LD_LIBRARY_PATH=/usr/local/lib/aarch64-linux-gnu:/usr/local/lib
      
    devices:
      # Tous les devices vidéo
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      
      # Devices média pour libcamera
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
      - /dev/media2:/dev/media2
      
      # GPIO
      - /dev/gpiomem:/dev/gpiomem

      # RPLidar (généralement /dev/ttyUSB0)
      - /dev/ttyUSB0:/dev/ttyUSB0      
    
    command: /bin/bash

volumes:
  ros2-cache:
